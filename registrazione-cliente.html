<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Registrazione cliente — 3DMAKES</title>
    <meta name="description" content="Compila i tuoi dati per essere registrato come cliente 3DMAKES.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="3dmakes-theme.css?v=2">
    <style>
        .intake-wrap {
            max-width: 560px;
            margin: 0 auto;
            padding: 24px 16px calc(40px + env(safe-area-inset-bottom));
        }
        .intake-card {
            background: var(--dm-white);
            border-radius: var(--dm-radius);
            box-shadow: var(--dm-shadow);
            border: 1px solid var(--dm-border);
            overflow: hidden;
        }
        .intake-card__head {
            padding: 28px 28px 12px;
            text-align: center;
        }
        .intake-card__head h1 {
            margin: 0 0 8px;
            font-size: 1.5rem;
            color: var(--dm-navy);
        }
        .intake-card__head p {
            margin: 0;
            color: var(--dm-text-muted);
            font-size: 0.95rem;
            line-height: 1.5;
        }
        .intake-card__body {
            padding: 8px 28px 28px;
        }
        .intake-form .form-group {
            margin-bottom: 16px;
        }
        .intake-form label {
            display: block;
            font-size: 0.82rem;
            font-weight: 700;
            color: var(--dm-navy);
            margin-bottom: 6px;
        }
        .intake-form input {
            width: 100%;
            max-width: 100%;
            padding: 14px 14px;
            border: 1px solid var(--dm-border);
            border-radius: 10px;
            font: inherit;
            font-size: 16px;
            color: var(--dm-text);
            background: #fff;
            -webkit-appearance: none;
            appearance: none;
        }
        .intake-form input:focus {
            outline: none;
            border-color: var(--dm-cyan);
            box-shadow: 0 0 0 3px rgba(0, 174, 239, 0.15);
        }
        .intake-form .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }
        @media (max-width: 520px) {
            .intake-form .form-row { grid-template-columns: 1fr; }
            .intake-card__head,
            .intake-card__body { padding-left: 18px; padding-right: 18px; }
            .intake-card__head { padding-top: 22px; }
            .intake-card__head h1 { font-size: 1.28rem; }
        }
        .intake-submit {
            width: 100%;
            margin-top: 8px;
            min-height: 48px;
            padding: 14px 20px;
            border: none;
            border-radius: var(--dm-radius-pill);
            background: var(--dm-cyan);
            color: #fff;
            font: inherit;
            font-size: 16px;
            font-weight: 800;
            cursor: pointer;
            touch-action: manipulation;
            -webkit-tap-highlight-color: transparent;
        }
        .intake-submit:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }
        .intake-status {
            text-align: center;
            padding: 48px 24px;
        }
        .intake-status__icon {
            font-size: 2.5rem;
            margin-bottom: 12px;
        }
        .intake-status h2 {
            margin: 0 0 8px;
            color: var(--dm-navy);
        }
        .intake-status p {
            margin: 0;
            color: var(--dm-text-muted);
            line-height: 1.5;
        }
        .intake-error { color: var(--dm-danger); }
        .intake-privacy {
            font-size: 0.78rem;
            color: var(--dm-text-muted);
            line-height: 1.45;
            margin-top: 14px;
        }
        .intake-type-toggle {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-bottom: 18px;
        }
        .intake-type-btn {
            padding: 12px 14px;
            border: 2px solid var(--dm-border);
            border-radius: 12px;
            background: #fff;
            color: var(--dm-navy);
            font: inherit;
            font-weight: 700;
            cursor: pointer;
            transition: border-color 0.15s, background 0.15s;
        }
        .intake-type-btn.is-active {
            border-color: var(--dm-cyan);
            background: rgba(0, 174, 239, 0.08);
        }
        .intake-type-panel {
            display: none !important;
        }
        .intake-type-panel.is-active {
            display: block !important;
        }
        .intake-type-fixed {
            margin: 0 0 16px;
            padding: 10px 14px;
            border-radius: 10px;
            background: rgba(0, 174, 239, 0.08);
            color: var(--dm-navy);
            font-size: 0.9rem;
            font-weight: 700;
            text-align: center;
        }
        .intake-retry {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            margin-top: 18px;
            min-height: 44px;
            padding: 12px 20px;
            border: none;
            border-radius: 999px;
            background: var(--dm-cyan);
            color: #fff;
            font: inherit;
            font-weight: 800;
            text-decoration: none;
            cursor: pointer;
            touch-action: manipulation;
        }
        .intake-browser-hint {
            margin: 14px 0 0;
            padding: 12px 14px;
            border-radius: 10px;
            background: #fff7ed;
            border: 1px solid #fdba74;
            color: #9a3412;
            font-size: 0.85rem;
            line-height: 1.45;
            text-align: left;
        }
        html, body.dm-page {
            overflow-x: hidden;
            overflow-y: auto;
            -webkit-overflow-scrolling: touch;
        }
    </style>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
    <script src="firebase-config.js?v=4"></script>
    <script src="firestore-init.js"></script>
</head>
<body class="dm-page" data-staff-public="true">
    <header class="dm-header" role="banner">
        <a href="https://3dmakes.ch" class="dm-logo" target="_blank" rel="noopener"><span class="dm-logo__d">3D</span><span class="dm-logo__m">MAKES</span></a>
    </header>

    <main class="intake-wrap">
        <div class="intake-card" id="intakeCard">
            <div class="intake-status" id="loadingState">
                <div class="intake-status__icon">⏳</div>
                <h2>Caricamento…</h2>
                <p>Verifica del link in corso.</p>
            </div>
        </div>
    </main>

    <script>
(function () {
    const USER_ID = 'shared_gestionale';
    const token = new URLSearchParams(window.location.search).get('t');

    function generateId() {
        return Date.now().toString(36) + Math.random().toString(36).substr(2);
    }

    function pathClient(clientId) {
        return 'clients/' + USER_ID + '/' + clientId;
    }

    function getFirestore() {
        return typeof initFirestoreDb === 'function' ? initFirestoreDb() : null;
    }

    function isInAppBrowser() {
        const ua = navigator.userAgent || '';
        if (/FBAN|FBAV|Instagram|Line\/|WhatsApp|Twitter|LinkedInApp|Snapchat|MicroMessenger/i.test(ua)) {
            return true;
        }
        const isIOS = /iPad|iPhone|iPod/.test(ua);
        if (isIOS && /AppleWebKit/.test(ua) && !/Safari\//.test(ua) && !/CriOS|FxiOS|EdgiOS/.test(ua)) {
            return true;
        }
        return false;
    }

    function browserHintHtml() {
        if (!isInAppBrowser()) return '';
        return '<p class="intake-browser-hint">Se il modulo non si apre, tocca <strong>⋮</strong> o <strong>Apri in Safari / Chrome</strong> in alto e riprova dal browser. WhatsApp e Instagram a volte bloccano il salvataggio.</p>';
    }

    function showState(html) {
        document.getElementById('intakeCard').innerHTML = html;
    }

    function showInvalid(message, withRetry) {
        showState(
            '<div class="intake-status">' +
            '<div class="intake-status__icon">🔗</div>' +
            '<h2>Link non valido</h2>' +
            '<p class="intake-error">' + message + '</p>' +
            browserHintHtml() +
            (withRetry ? '<button type="button" class="intake-retry" id="intakeRetryBtn">Riprova</button>' : '') +
            '</div>'
        );
        const retry = document.getElementById('intakeRetryBtn');
        if (retry) retry.addEventListener('click', function () { window.location.reload(); });
    }

    function showSuccess() {
        showState(
            '<div class="intake-status">' +
            '<div class="intake-status__icon">✅</div>' +
            '<h2>Grazie!</h2>' +
            '<p>I tuoi dati sono stati inviati correttamente.<br>Ti contatteremo al più presto.</p>' +
            '</div>'
        );
    }

    function renderForm(linkData) {
        const clientType = linkData.clientType === 'aziendale' ? 'aziendale' : 'privato';
        const isAzienda = clientType === 'aziendale';
        const labelNote = linkData.label
            ? '<p style="margin-top:8px;font-size:0.85rem;color:var(--dm-cyan);font-weight:600;">' + escapeHtml(linkData.label) + '</p>'
            : '';
        const typeBanner = isAzienda
            ? '<p class="intake-type-fixed">🏢 Registrazione azienda</p>'
            : '<p class="intake-type-fixed">👤 Registrazione privato</p>';

        let identityFields = '';
        if (isAzienda) {
            identityFields =
                '<div class="form-group"><label for="ragioneSociale">Ragione sociale *</label><input type="text" id="ragioneSociale" autocomplete="organization" autocapitalize="words" enterkeyhint="next"></div>' +
                '<div class="form-group"><label for="vat">P.IVA / Codice Fiscale *</label><input type="text" id="vat" autocapitalize="characters" enterkeyhint="next"></div>';
        } else {
            identityFields =
                '<div class="form-row">' +
                '<div class="form-group"><label for="nome">Nome *</label><input type="text" id="nome" autocomplete="given-name" autocapitalize="words" enterkeyhint="next"></div>' +
                '<div class="form-group"><label for="cognome">Cognome *</label><input type="text" id="cognome" autocomplete="family-name" autocapitalize="words" enterkeyhint="next"></div>' +
                '</div>';
        }

        showState(
            '<div class="intake-card__head">' +
            '<h1>I tuoi dati</h1>' +
            '<p>Compila il modulo per completare la registrazione come cliente 3DMAKES.</p>' +
            labelNote +
            '</div>' +
            '<div class="intake-card__body">' +
            '<form class="intake-form" id="intakeForm" novalidate>' +
            typeBanner +
            identityFields +
            '<div class="form-group"><label for="email">Email *</label><input type="email" id="email" required autocomplete="email" inputmode="email" enterkeyhint="next"></div>' +
            '<div class="form-group"><label for="phone">Telefono *</label><input type="tel" id="phone" required autocomplete="tel" inputmode="tel" enterkeyhint="next"></div>' +
            '<div class="form-group"><label for="address">Indirizzo</label><input type="text" id="address" autocomplete="street-address" autocapitalize="words" placeholder="Via, numero civico" enterkeyhint="next"></div>' +
            '<div class="form-row">' +
            '<div class="form-group"><label for="postalCode">CAP</label><input type="text" id="postalCode" autocomplete="postal-code" placeholder="es. 6900"></div>' +
            '<div class="form-group"><label for="city">Città</label><input type="text" id="city" autocomplete="address-level2" placeholder="es. Lugano"></div>' +
            '</div>' +
            '<div class="form-group"><label for="country">Paese</label><input type="text" id="country" autocomplete="country-name" placeholder="es. Svizzera" value="Svizzera"></div>' +
            '<button type="submit" class="intake-submit" id="submitBtn">Invia dati</button>' +
            '<p class="intake-privacy">I dati inseriti verranno utilizzati da 3DMAKES per gestire la relazione commerciale e per contattarti in merito ai servizi richiesti.</p>' +
            '</form></div>'
        );

        document.getElementById('intakeForm').addEventListener('submit', function (e) {
            e.preventDefault();
            submitForm(linkData, clientType);
        });

        document.querySelectorAll('#intakeForm input').forEach(function (input) {
            input.addEventListener('focus', function () {
                setTimeout(function () {
                    try { input.scrollIntoView({ block: 'center', behavior: 'smooth' }); } catch (e) { /* ignore */ }
                }, 300);
            });
        });
    }

    function escapeHtml(text) {
        return String(text)
            .replace(/&/g, '&amp;')
            .replace(/</g, '&lt;')
            .replace(/>/g, '&gt;')
            .replace(/"/g, '&quot;');
    }

    function submitForm(linkData, clientType) {
        const email = document.getElementById('email').value.trim();
        const phone = document.getElementById('phone').value.trim();
        let name = '';
        let vat = '';

        if (clientType === 'aziendale') {
            name = document.getElementById('ragioneSociale').value.trim();
            vat = document.getElementById('vat').value.trim();
            if (!name) {
                alert('La ragione sociale è obbligatoria.');
                return;
            }
            if (!vat) {
                alert('La P.IVA / Codice Fiscale è obbligatorio per le aziende.');
                return;
            }
        } else {
            const nome = document.getElementById('nome').value.trim();
            const cognome = document.getElementById('cognome').value.trim();
            if (!nome || !cognome) {
                alert('Nome e cognome sono obbligatori.');
                return;
            }
            name = [nome, cognome].filter(Boolean).join(' ').trim();
        }

        if (!email) {
            alert('L\'email è obbligatoria.');
            return;
        }
        if (!phone) {
            alert('Il telefono è obbligatorio.');
            return;
        }

        const btn = document.getElementById('submitBtn');
        btn.disabled = true;
        btn.textContent = 'Invio in corso…';

        const clientId = generateId();
        const client = {
            id: clientId,
            name: name,
            clientType: clientType,
            acquisitionDate: new Date().toISOString().split('T')[0],
            email: email,
            phone: phone,
            address: document.getElementById('address').value.trim(),
            postalCode: document.getElementById('postalCode').value.trim(),
            city: document.getElementById('city').value.trim(),
            country: document.getElementById('country').value.trim() || 'Svizzera',
            vat: vat,
            source: 'public_form',
            intakeToken: token,
            createdAt: new Date().toISOString(),
            orders: {},
            documents: {},
            notes: {},
            files: {}
        };

        const rtdb = firebase.database();
        const fs = getFirestore();
        if (!fs) {
            alert('Servizio temporaneamente non disponibile. Riprova più tardi.');
            btn.disabled = false;
            btn.textContent = 'Invia dati';
            return;
        }

        rtdb.ref(pathClient(clientId)).set(client)
            .then(function () {
                return fs.collection('client_intake_links').doc(token).update({
                    used: true,
                    usedAt: new Date().toISOString(),
                    clientId: clientId,
                    clientName: name
                });
            })
            .then(function () {
                showSuccess();
            })
            .catch(function (err) {
                console.error(err);
                btn.disabled = false;
                btn.textContent = 'Invia dati';
                alert('Errore durante l\'invio. Riprova tra qualche istante.');
            });
    }

    if (!token) {
        showInvalid('Questo link non contiene un codice valido. Chiedi a 3DMAKES un nuovo link di registrazione.');
        return;
    }

    initFirebaseAuthAnon()
        .then(function () {
            const fs = getFirestore();
            if (!fs) throw new Error('Firestore non disponibile');
            return fs.collection('client_intake_links').doc(token).get();
        })
        .then(function (doc) {
            if (!doc || !doc.exists) {
                showInvalid('Il link non è valido o è scaduto. Contatta 3DMAKES per riceverne uno nuovo.');
                return;
            }
            const linkData = doc.data();
            if (linkData.active === false) {
                showInvalid('Il link non è più attivo. Contatta 3DMAKES per riceverne uno nuovo.');
                return;
            }
            if (linkData.used) {
                showInvalid('Questo link è già stato utilizzato. Se hai bisogno di aggiornare i dati, contattaci direttamente.');
                return;
            }
            renderForm(linkData);
        })
        .catch(function (err) {
            console.error(err);
            const msg = err && err.message ? String(err.message) : '';
            const extra = /Timeout|Safari|Chrome|browser/i.test(msg)
                ? msg
                : 'Impossibile verificare il link. Controlla la connessione e riprova.';
            showInvalid(extra, true);
        });
})();
    </script>
</body>
</html>
